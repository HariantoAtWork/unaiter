networks:
  default:
    name: tsdproxy
    external: true

services:
  # Hot-reload Nuxt: docker compose -f _dev.yml up -d --build
  # Does not start with plain `docker compose up`.
  unaiter-dev:
    labels:
      tsdproxy.enable: true
      tsdproxy.name: unaiter-dev
      tsdproxy.autodetect: true
      tsdproxy.port.1: "443/https:3000/http"
      tsdproxy.host.2: "80/http:3000/http"
    image: oven/bun:canary-alpine
    container_name: unaiter-dev
    working_dir: /app
    command: ["sh", "-c", "bun install && exec bun run dev"]
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src/unaiter:/app
      - unaiter-dev-modules:/app/node_modules  # Linux modules inside the container
      - .data:/var/lib/unaiter
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      # Bun.serve idleTimeout seconds (max 255). 0 disables — keeps slow AI/SSE streams alive through quiet gaps.
      - NITRO_BUN_IDLE_TIMEOUT=${NITRO_BUN_IDLE_TIMEOUT:-0}
      - TZ=${TZ:-UTC}
      - ADMINISTRATOR_USERNAME=${ADMINISTRATOR_USERNAME:-}
      - ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      - NUXT_ADMINISTRATOR_USERNAME=${ADMINISTRATOR_USERNAME:-}
      - NUXT_ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      # Container path for the mounted data volume (do not use host-relative ./data).
      - NUXT_DATA_ROOT=/var/lib/unaiter

volumes:
  unaiter-dev-modules:
